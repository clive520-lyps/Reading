<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端閱讀認證PIRLS國際閱讀素養學生端</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F0; color: #141414; }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .markdown-body h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1rem; }
        .markdown-body p { margin-bottom: 1.25rem; line-height: 1.8; color: #374151; font-size: 1.125rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9NJXQwdKweStTbATahldDgvtbuGclo34",
            authDomain: "test-reading-71839.firebaseapp.com",
            databaseURL: "https://test-reading-71839-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "test-reading-71839",
            storageBucket: "test-reading-71839.firebasestorage.app",
            messagingSenderId: "499192051513",
            appId: "1:499192051513:web:717a1276cc6dfeed995ae8",
            measurementId: "G-SCPBVK0XYX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Expose to window for React
        window.fb = { db, ref, set, get, push, onValue, update };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- PIRLS Constants & Definitions ---
        const PIRLS_PROCESS_LABELS = {
            L1_RETRIEVE: {
                label: 'L1 提取特定訊息',
                short: 'L1 提取訊息',
                description: '找出文章中直接明確敘述的字面訊息與關鍵事實',
                badgeColor: 'bg-blue-50 text-blue-700 border-blue-200'
            },
            L2_INFER: {
                label: 'L2 直接推論',
                short: 'L2 直接推論',
                description: '連結句子與段落間的直觀因果關係與角色意圖',
                badgeColor: 'bg-emerald-50 text-emerald-700 border-emerald-200'
            },
            L3_INTERPRET: {
                label: 'L3 詮釋與整合觀點和訊息',
                short: 'L3 詮釋整合',
                description: '融會貫通跨段落意旨、歸納核心主旨與比較情境',
                badgeColor: 'bg-amber-50 text-amber-700 border-amber-200'
            },
            L4_EVALUATE: {
                label: 'L4 檢驗與評估內容、語言和文章元素',
                short: 'L4 檢驗評估',
                description: '批判性評估作者視角、修辭手法與結構完整性',
                badgeColor: 'bg-purple-50 text-purple-700 border-purple-200'
            }
        };

        const PIRLS_BENCHMARK_CONFIG = {
            advanced: {
                label: '優秀基準 (Advanced >= 625)',
                short: '優秀基準',
                badgeColor: 'bg-purple-100 text-purple-800 border border-purple-200',
                color: 'bg-purple-50 text-purple-700 border-purple-200',
                description: '能整合全篇深層意涵、批判評估文章觀點與作者修辭'
            },
            high: {
                label: '高基準 (High 550-624)',
                short: '高基準',
                badgeColor: 'bg-blue-100 text-blue-800 border border-blue-200',
                color: 'bg-blue-50 text-blue-700 border-blue-200',
                description: '能推論篇章因果、掌握主旨並提供文本佐證'
            },
            intermediate: {
                label: '中基準 (Intermediate 475-549)',
                short: '中基準',
                badgeColor: 'bg-emerald-100 text-emerald-800 border border-emerald-200',
                color: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                description: '能提取特定重要情節、進行簡易直觀推論'
            },
            low: {
                label: '低基準 (Low 400-474)',
                short: '低基準',
                badgeColor: 'bg-amber-100 text-amber-800 border border-amber-200',
                color: 'bg-amber-50 text-amber-700 border-amber-200',
                description: '能在文章中尋找單一、字面直接說明的具體訊息'
            },
            below_low: {
                label: '待加強基準 (< 400)',
                short: '待加強',
                badgeColor: 'bg-rose-100 text-rose-800 border border-rose-200',
                color: 'bg-rose-50 text-rose-700 border-rose-200',
                description: '字詞掌握與長文閱讀耐力尚需加強基礎導讀'
            }
        };

        const TEXT_TYPE_LABELS = {
            literary: { label: '文學性文本', color: 'bg-amber-50 text-amber-800 border border-amber-200' },
            informational: { label: '資訊性文本', color: 'bg-blue-50 text-blue-800 border border-blue-200' }
        };

        const GRADE_LEVEL_LABELS = {
            elementary_mid: '國小中年級',
            elementary_high: '國小高年級',
            junior_high: '國中階段'
        };

        // --- Helper: Icon Component ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const wrapperRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && wrapperRef.current) {
                    wrapperRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px; display: block;"></i>`;
                    try {
                        lucide.createIcons({ root: wrapperRef.current });
                    } catch (e) {
                        console.error("Lucide icon creation failed", e);
                    }
                }
            }, [name, size, className]);

            return <span ref={wrapperRef} className="inline-flex items-center justify-center" style={{ width: size, height: size }}></span>;
        };

        // --- Helper: PIRLS Process Badge ---
        const PirlsBadge = ({ process, size = 'sm' }) => {
            if (!process) return null;
            const info = PIRLS_PROCESS_LABELS[process] || { short: process, badgeColor: 'bg-gray-100 text-gray-700 border-gray-200' };
            const pad = size === 'sm' ? 'px-2.5 py-0.5 text-[10px]' : 'px-3 py-1 text-xs';
            return (
                <span className={`inline-flex items-center gap-1 font-bold rounded-full border ${info.badgeColor} ${pad}`}>
                    <Icon name="compass" size={size === 'sm' ? 10 : 12} />
                    {info.short}
                </span>
            );
        };

        // --- Component: PIRLS Radar Chart (SVG) ---
        const PIRLSRadarChart = ({ scores = {}, size = 280, className = "" }) => {
            const dimensions = [
                { key: 'L1', label: 'L1 提取特定訊息', short: 'L1 提取', angle: -Math.PI / 2 },
                { key: 'L2', label: 'L2 直接推論', short: 'L2 推論', angle: 0 },
                { key: 'L3', label: 'L3 詮釋整合觀點', short: 'L3 詮釋', angle: Math.PI / 2 },
                { key: 'L4', label: 'L4 檢驗與評估', short: 'L4 評估', angle: Math.PI }
            ];

            const center = size / 2;
            const radius = (size / 2) - 40;
            const gridLevels = [0.25, 0.5, 0.75, 1.0];

            const getGridPolygon = (level) => {
                return dimensions.map(dim => {
                    const r = radius * level;
                    const x = center + r * Math.cos(dim.angle);
                    const y = center + r * Math.sin(dim.angle);
                    return `${x},${y}`;
                }).join(' ');
            };

            const dataPoints = dimensions.map(dim => {
                const rawVal = scores[dim.key] !== undefined ? scores[dim.key] : 70;
                const clampedVal = Math.max(0, Math.min(100, rawVal));
                const r = (radius * clampedVal) / 100;
                const x = center + r * Math.cos(dim.angle);
                const y = center + r * Math.sin(dim.angle);
                return { x, y, value: Math.round(clampedVal), dim };
            });

            const polygonPath = dataPoints.map(p => `${p.x},${p.y}`).join(' ');

            return (
                <div className={`flex flex-col items-center select-none ${className}`}>
                    <div className="relative">
                        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="overflow-visible">
                            <defs>
                                <linearGradient id="pirlsRadarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#5A5A40" stopOpacity="0.45" />
                                    <stop offset="100%" stopColor="#8A8A65" stopOpacity="0.2" />
                                </linearGradient>
                            </defs>

                            {/* Concentric grids */}
                            {gridLevels.map((lvl, i) => (
                                <polygon
                                    key={i}
                                    points={getGridPolygon(lvl)}
                                    fill={i % 2 === 0 ? '#F9F9F6' : '#FFFFFF'}
                                    stroke="#E5E7EB"
                                    strokeWidth="1"
                                    strokeDasharray={i === gridLevels.length - 1 ? 'none' : '3,3'}
                                />
                            ))}

                            {/* Axis lines */}
                            {dimensions.map((dim, i) => {
                                const x = center + radius * Math.cos(dim.angle);
                                const y = center + radius * Math.sin(dim.angle);
                                return (
                                    <line
                                        key={i}
                                        x1={center}
                                        y1={center}
                                        x2={x}
                                        y2={y}
                                        stroke="#D1D5DB"
                                        strokeWidth="1.2"
                                    />
                                );
                            })}

                            {/* Data polygon */}
                            <polygon
                                points={polygonPath}
                                fill="url(#pirlsRadarGrad)"
                                stroke="#5A5A40"
                                strokeWidth="2.5"
                            />

                            {/* Data points */}
                            {dataPoints.map((p, i) => (
                                <g key={i}>
                                    <circle
                                        cx={p.x}
                                        cy={p.y}
                                        r="5"
                                        fill="#5A5A40"
                                        stroke="#FFFFFF"
                                        strokeWidth="2"
                                    />
                                    <text
                                        x={p.x}
                                        y={p.y - 8}
                                        textAnchor="middle"
                                        fontSize="10"
                                        fontWeight="bold"
                                        fill="#374151"
                                    >
                                        {p.value}%
                                    </text>
                                </g>
                            ))}

                            {/* Axis Labels */}
                            {dimensions.map((dim, i) => {
                                const offsetR = radius + 22;
                                const x = center + offsetR * Math.cos(dim.angle);
                                const y = center + offsetR * Math.sin(dim.angle);
                                let anchor = "middle";
                                if (dim.key === 'L2') anchor = "start";
                                if (dim.key === 'L4') anchor = "end";

                                return (
                                    <text
                                        key={i}
                                        x={x}
                                        y={y + 4}
                                        textAnchor={anchor}
                                        fontSize="10"
                                        fontWeight="bold"
                                        fill="#4B5563"
                                    >
                                        {dim.short}
                                    </text>
                                );
                            })}
                        </svg>
                    </div>

                    {/* Legend */}
                    <div className="grid grid-cols-2 gap-2 mt-4 text-[11px] w-full max-w-xs">
                        {dimensions.map(dim => (
                            <div key={dim.key} className="flex items-center justify-between px-2.5 py-1 rounded-lg bg-gray-50 border border-gray-100">
                                <span className="text-gray-500 font-medium">{dim.short}</span>
                                <span className="font-mono font-bold text-[#5A5A40]">{scores[dim.key] ?? 70}%</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- Component: PIRLS Benchmark Scale ---
        const PIRLSBenchmarkScale = ({ score = 520, benchmark = 'intermediate', className = "" }) => {
            const MIN_SCORE = 300;
            const MAX_SCORE = 750;
            const clampedScore = Math.max(MIN_SCORE, Math.min(MAX_SCORE, score));
            const percentPosition = ((clampedScore - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * 100;
            const getPercent = (s) => ((s - MIN_SCORE) / (MAX_SCORE - MIN_SCORE)) * 100;

            const currentBenchmarkInfo = PIRLS_BENCHMARK_CONFIG[benchmark] || PIRLS_BENCHMARK_CONFIG.intermediate;

            return (
                <div className={`space-y-4 ${className}`}>
                    <div className="flex flex-wrap items-center justify-between gap-3 p-4 rounded-2xl bg-[#5A5A40]/5 border border-[#5A5A40]/15">
                        <div>
                            <span className="text-xs uppercase font-bold text-gray-500 tracking-wider">PIRLS 國際常模標準分數</span>
                            <div className="flex items-baseline gap-3 mt-1">
                                <span className="text-3xl font-extrabold font-mono text-[#5A5A40]">{score}</span>
                                <span className="text-xs text-gray-500 font-medium">（常模平均 500 分，標準差 100）</span>
                            </div>
                        </div>
                        <div className="text-right">
                            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">達成基準級別</span>
                            <span className={`inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm ${currentBenchmarkInfo.badgeColor}`}>
                                {currentBenchmarkInfo.label}
                            </span>
                        </div>
                    </div>

                    <div className="pt-8 pb-4 px-2">
                        <div className="relative">
                            {/* Score Marker */}
                            <div
                                className="absolute -top-7 transform -translate-x-1/2 flex flex-col items-center transition-all duration-500"
                                style={{ left: `${percentPosition}%` }}
                            >
                                <div className="bg-[#1F2937] text-white text-[10px] font-mono font-bold px-2 py-0.5 rounded-md shadow-md whitespace-nowrap">
                                    本次落點：{score} 分
                                </div>
                                <div className="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-t-[5px] border-t-[#1F2937]" />
                            </div>

                            {/* Color track */}
                            <div className="h-4 rounded-full overflow-hidden flex shadow-inner bg-gray-200">
                                <div className="bg-rose-400" style={{ width: `${getPercent(400)}%` }} title="待加強 (<400)" />
                                <div className="bg-amber-400" style={{ width: `${getPercent(475) - getPercent(400)}%` }} title="低基準 (400-474)" />
                                <div className="bg-emerald-400" style={{ width: `${getPercent(550) - getPercent(475)}%` }} title="中基準 (475-549)" />
                                <div className="bg-blue-400" style={{ width: `${getPercent(625) - getPercent(550)}%` }} title="高基準 (550-624)" />
                                <div className="bg-purple-500" style={{ width: `${100 - getPercent(625)}%` }} title="優秀基準 (>=625)" />
                            </div>

                            {/* International Average Marker (500) */}
                            <div
                                className="absolute top-0 bottom-0 w-0.5 bg-gray-800 z-10"
                                style={{ left: `${getPercent(500)}%` }}
                            >
                                <div className="absolute top-5 left-1/2 -translate-x-1/2 flex flex-col items-center">
                                    <span className="text-[10px] text-gray-700 font-bold whitespace-nowrap bg-white/95 px-1 rounded border border-gray-300 shadow-xs">
                                        500 (國際平均)
                                    </span>
                                </div>
                            </div>

                            {/* Tick markers */}
                            <div className="relative w-full text-[9px] font-mono text-gray-500 mt-2">
                                <span className="absolute left-0 -translate-x-1/2">300</span>
                                <span className="absolute -translate-x-1/2" style={{ left: `${getPercent(400)}%` }}>400 (低)</span>
                                <span className="absolute -translate-x-1/2" style={{ left: `${getPercent(475)}%` }}>475 (中)</span>
                                <span className="absolute -translate-x-1/2" style={{ left: `${getPercent(550)}%` }}>550 (高)</span>
                                <span className="absolute -translate-x-1/2" style={{ left: `${getPercent(625)}%` }}>625 (優)</span>
                                <span className="absolute right-0 translate-x-1/2">750+</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Component: PIRLS Diagnostic Report Card ---
        const PIRLSDiagnosticReport = ({ pirlsResult, score, className = "" }) => {
            const safeScore = score ?? 80;
            const result = pirlsResult || {
                pirlsScore: Math.round(350 + (safeScore / 100) * 350),
                benchmark: (safeScore >= 88 ? 'advanced' : (safeScore >= 75 ? 'high' : (safeScore >= 60 ? 'intermediate' : (safeScore >= 45 ? 'low' : 'below_low')))),
                radarScores: {
                    L1: Math.min(100, Math.round(safeScore * 1.05)),
                    L2: Math.min(100, Math.round(safeScore * 0.98)),
                    L3: Math.max(0, Math.round(safeScore * 0.92)),
                    L4: Math.max(0, Math.round(safeScore * 0.85)),
                },
                strengths: [
                    '能精確提取文章字面直接記載的事實與核心細節（L1 提取特定訊息）',
                    '善於梳理文章情節的前後因果關聯（L2 直接推論）',
                ],
                weaknesses: [
                    '面對跨段落的主旨統整與觀點評估時可再深入思考（L3/L4 詮釋與檢驗）',
                    '建議閱讀時多思考作者為何使用特定詞語與段落安排，培養批判性素養。',
                ],
                overallDiagnosis: '受測者在本次測驗中表現穩健，閱讀素養落於國際標準常模中上區間，具備扎實的資訊檢索與推論能力。'
            };

            const benchmarkConfig = PIRLS_BENCHMARK_CONFIG[result.benchmark] || PIRLS_BENCHMARK_CONFIG.intermediate;

            return (
                <div className={`bg-gradient-to-br from-white via-[#FCFCF9] to-[#F5F5ED] rounded-[2.5rem] p-8 border border-[#5A5A40]/15 shadow-md space-y-8 ${className}`}>
                    {/* Header */}
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-gray-100">
                        <div className="flex items-center gap-4">
                            <div className="w-14 h-14 rounded-2xl bg-[#5A5A40] text-white flex items-center justify-center shadow-lg shadow-[#5A5A40]/20">
                                <Icon name="compass" size={28} />
                            </div>
                            <div>
                                <span className="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-[#5A5A40]/10 text-[#5A5A40]">
                                    IEA PIRLS 國際閱讀素養架構
                                </span>
                                <h3 className="text-2xl font-bold serif text-gray-900 mt-1">
                                    PIRLS 國際閱讀素養全方位診斷報告
                                </h3>
                            </div>
                        </div>
                        <div className="text-right">
                            <span className="text-[10px] uppercase font-bold text-gray-400 block mb-1">國際常模等級</span>
                            <span className={`inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-xs font-bold ${benchmarkConfig.badgeColor}`}>
                                <Icon name="award" size={14} />
                                {benchmarkConfig.label}
                            </span>
                        </div>
                    </div>

                    {/* Scale */}
                    <div className="space-y-3">
                        <h4 className="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <Icon name="award" size={18} className="text-[#5A5A40]" />
                            一、PIRLS 國際標準基準落點
                        </h4>
                        <PIRLSBenchmarkScale
                            score={result.pirlsScore}
                            benchmark={result.benchmark}
                        />
                    </div>

                    {/* 4D Radar + Strengths/Weaknesses */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center pt-2">
                        {/* Radar */}
                        <div className="lg:col-span-5 flex flex-col items-center justify-center bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                            <h4 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                                四向度認知歷程表現
                            </h4>
                            <PIRLSRadarChart scores={result.radarScores} size={260} />
                        </div>

                        {/* Diagnostics */}
                        <div className="lg:col-span-7 space-y-4">
                            {/* Strengths */}
                            <div className="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-5">
                                <div className="flex items-center gap-2 mb-3 text-emerald-800 font-bold text-sm">
                                    <Icon name="sparkles" size={16} className="text-emerald-600" />
                                    <span>優勢面向（表現亮眼）</span>
                                </div>
                                <ul className="space-y-2 text-xs md:text-sm text-emerald-950">
                                    {(result.strengths || []).map((item, idx) => (
                                        <li key={idx} className="flex items-start gap-2">
                                            <span className="text-emerald-500 font-bold mt-0.5">•</span>
                                            <span className="leading-relaxed">{item}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {/* Weaknesses */}
                            <div className="bg-amber-50/70 border border-amber-100 rounded-2xl p-5">
                                <div className="flex items-center gap-2 mb-3 text-amber-900 font-bold text-sm">
                                    <Icon name="target" size={16} className="text-amber-600" />
                                    <span>待加強面向與導讀建議</span>
                                </div>
                                <ul className="space-y-2 text-xs md:text-sm text-amber-950">
                                    {(result.weaknesses || []).map((item, idx) => (
                                        <li key={idx} className="flex items-start gap-2">
                                            <span className="text-amber-500 font-bold mt-0.5">•</span>
                                            <span className="leading-relaxed">{item}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            {/* Overall Diagnosis */}
                            {result.overallDiagnosis && (
                                <div className="bg-white border border-gray-100 rounded-2xl p-4 text-xs leading-relaxed text-gray-600">
                                    <span className="font-bold text-gray-800 mr-1">💡 綜合素養講評：</span>
                                    {result.overallDiagnosis}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [fbReady, setFbReady] = useState(false);

            useEffect(() => {
                const checkFb = setInterval(() => {
                    if (window.fb && window.fb.db) {
                        setFbReady(true);
                        clearInterval(checkFb);
                    }
                }, 100);
                return () => clearInterval(checkFb);
            }, []);

            const handleLogin = async (studentId, pass) => {
                if (!window.fb) return;
                setLoading(true);
                setError(null);
                try {
                    const cleanId = (studentId || '').trim();
                    const cleanPass = (pass || '').trim();
                    const studentRef = window.fb.ref(window.fb.db, `students/${cleanId}`);
                    const snapshot = await window.fb.get(studentRef);
                    if (snapshot.exists() && snapshot.val().password === cleanPass) {
                        const sData = snapshot.val();
                        setUser({ id: cleanId, studentId: cleanId, ...sData });
                        setView('dashboard');
                    } else {
                        setError('帳號或密碼錯誤');
                    }
                } catch (err) {
                    setError('登入失敗，請確認網路連線');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                setUser(null);
                setView('login');
            };

            if (!fbReady) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">
                    <div className="w-16 h-16 border-4 border-[#5A5A40] border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-gray-500 font-medium">PIRLS 認證系統初始化中...</p>
                </div>
            );

            if (view === 'login') return <LoginPortal onLogin={handleLogin} loading={loading} error={error} />;
            return <StudentDashboard user={user} onLogout={handleLogout} />;
        };

        // --- Login Portal ---
        const LoginPortal = ({ onLogin, loading, error }) => {
            const [studentId, setStudentId] = useState('');
            const [password, setPassword] = useState('');

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">
                    <div className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-black/5">
                        <div className="p-10">
                            <div className="flex justify-center mb-6">
                                <div className="w-20 h-20 bg-[#5A5A40] rounded-3xl flex items-center justify-center text-white shadow-lg shadow-[#5A5A40]/30">
                                    <Icon name="book-open" size={40} />
                                </div>
                            </div>
                            <div className="text-center mb-8">
                                <span className="bg-[#5A5A40]/10 text-[#5A5A40] text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full">
                                    IEA PIRLS 閱讀認證
                                </span>
                                <h1 className="text-3xl font-bold mt-2 serif">學生端登入</h1>
                                <p className="text-gray-500 text-sm mt-1">開啟四層次素養評量之旅</p>
                            </div>

                            {error && (
                                <div className="mb-6 p-4 bg-red-50 text-red-600 text-sm rounded-2xl border border-red-100 flex items-center gap-2">
                                    <Icon name="alert-circle" size={18} />
                                    {error}
                                </div>
                            )}

                            <form onSubmit={(e) => { e.preventDefault(); onLogin(studentId, password); }} className="space-y-6">
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">學生帳號</label>
                                    <input 
                                        type="text" 
                                        value={studentId}
                                        onChange={(e) => setStudentId(e.target.value)}
                                        className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#5A5A40] outline-none transition-all"
                                        placeholder="例如：S10101"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 ml-1">密碼</label>
                                    <input 
                                        type="password" 
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-[#5A5A40] outline-none transition-all"
                                        placeholder="請輸入密碼"
                                        required
                                    />
                                </div>
                                <button 
                                    disabled={loading}
                                    className="w-full py-4 bg-[#5A5A40] text-white rounded-2xl font-bold text-lg hover:bg-[#4A4A30] shadow-xl shadow-[#5A5A40]/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50"
                                >
                                    {loading ? <Icon name="loader-2" className="animate-spin" /> : '登入系統'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Student Dashboard ---
        const StudentDashboard = ({ user, onLogout }) => {
            const [articles, setArticles] = useState([]);
            const [records, setRecords] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [recordsLoaded, setRecordsLoaded] = useState(false);
            const [selectedArticle, setSelectedArticle] = useState(null);
            const [selectedRecord, setSelectedRecord] = useState(null);
            const [detailQuestions, setDetailQuestions] = useState(null);
            const [view, setView] = useState('list');

            useEffect(() => {
                const articlesRef = window.fb.ref(window.fb.db, 'articles');
                const unsubscribeArticles = window.fb.onValue(articlesRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.entries(data).map(([id, val]) => ({ id, ...val }));
                        setArticles(list);
                    }
                });

                const recordsRef = window.fb.ref(window.fb.db, 'records');
                const unsubscribeRecords = window.fb.onValue(recordsRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const studentIdNorm = String(user?.id || user?.studentId || '').trim().toLowerCase();
                        const list = Object.entries(data)
                            .map(([id, val]) => ({ id, ...val }))
                            .filter(r => {
                                const rSid = String(r.studentId || '').trim().toLowerCase();
                                return rSid && studentIdNorm && rSid === studentIdNorm;
                            })
                            .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                        setRecords(list);

                        // If viewing detail, update selectedRecord
                        setSelectedRecord(prev => {
                            if (!prev) return null;
                            const updated = list.find(r => r.id === prev.id);
                            return updated || prev;
                        });
                    } else {
                        setRecords([]);
                    }
                    setRecordsLoaded(true);
                });

                const assignmentsRef = window.fb.ref(window.fb.db, 'assignments');
                const unsubscribeAssignments = window.fb.onValue(assignmentsRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.entries(data)
                            .map(([id, val]) => ({ id, ...val }))
                            .filter(as => as.classId === user.classId && as.active)
                            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        setAssignments(list);
                    } else {
                        setAssignments([]);
                    }
                });

                return () => {
                    unsubscribeArticles();
                    unsubscribeRecords();
                    unsubscribeAssignments();
                };
            }, [user.id, user.studentId, user.classId]);

            const assignedArticles = articles
                .filter(a => assignments.some(as => String(as.articleId) === String(a.id)))
                .map(a => {
                    const matchingAssignments = assignments
                        .filter(as => String(as.articleId) === String(a.id))
                        .sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
                    const assignment = matchingAssignments[0];
                    const isSingle = matchingAssignments.some(as => as.attemptType === 'single') || assignment?.attemptType === 'single';
                    return { ...a, assignment: { ...assignment, attemptType: isSingle ? 'single' : 'multiple' } };
                })
                .sort((a, b) => {
                    const isExpiredA = a.assignment ? Date.now() > a.assignment.deadline : false;
                    const isExpiredB = b.assignment ? Date.now() > b.assignment.deadline : false;
                    
                    if (isExpiredA && !isExpiredB) return 1;
                    if (!isExpiredA && isExpiredB) return -1;
                    
                    return (b.assignment?.createdAt || 0) - (a.assignment?.createdAt || 0);
                });

            const handleViewDetail = async (r) => {
                setSelectedRecord(r); 
                setDetailQuestions(null);
                setView('detail');
                
                try {
                    const tf = await window.fb.get(window.fb.ref(window.fb.db, `questions_tf/${r.articleId}`));
                    const mc = await window.fb.get(window.fb.ref(window.fb.db, `questions_mc/${r.articleId}`));
                    const en_mc = await window.fb.get(window.fb.ref(window.fb.db, `questions_en_mc/${r.articleId}`));
                    const sa = await window.fb.get(window.fb.ref(window.fb.db, `questions_sa/${r.articleId}`));
                    
                    setDetailQuestions({
                        tf: tf.val() || [],
                        mc: mc.val() || [],
                        en_mc: en_mc.val() || [],
                        sa: sa.val() || []
                    });
                } catch (e) {
                    console.error("Failed to fetch detail questions", e);
                }
            };

            // Find recent completed/graded record for notification
            const gradedRecords = records.filter(r => r.graded);
            const latestGradedRecord = gradedRecords.length > 0
                ? [...gradedRecords].sort((a, b) => (b.gradedAt || b.timestamp) - (a.gradedAt || a.timestamp))[0]
                : null;

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white border-b border-black/5 px-8 py-5 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md bg-white/90">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-[#5A5A40] rounded-2xl flex items-center justify-center text-white shadow-lg shadow-[#5A5A40]/20">
                                <Icon name="book-open" size={24} />
                            </div>
                            <div>
                                <h2 className="font-bold text-xl serif">雲端閱讀認證系統</h2>
                                <p className="text-xs text-gray-400">PIRLS 國際閱讀素養平台 ｜ 歡迎，{user.name} 同學！</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <nav className="hidden md:flex items-center bg-gray-100 p-1.5 rounded-2xl">
                                <button 
                                    onClick={() => setView('list')}
                                    className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${view === 'list' ? "bg-white shadow-md text-[#5A5A40]" : "text-gray-500 hover:text-gray-800"}`}
                                >
                                    文章列表
                                </button>
                                <button 
                                    onClick={() => setView('results')}
                                    className={`px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${view === 'results' ? "bg-white shadow-md text-[#5A5A40]" : "text-gray-500 hover:text-gray-800"}`}
                                >
                                    我的成績與診斷
                                </button>
                            </nav>
                            <button onClick={onLogout} className="p-3 bg-gray-50 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-2xl transition-all" title="登出">
                                <Icon name="log-out" size={22} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 p-8 max-w-6xl mx-auto w-full">
                        {/* VIEW: Article List */}
                        {view === 'list' && (
                            <div className="space-y-12">
                                {/* Top notification banner when there is a newly graded record */}
                                {latestGradedRecord && (
                                    <div className="bg-gradient-to-r from-emerald-800 via-[#4A4A30] to-[#5A5A40] text-white p-8 rounded-[2.5rem] shadow-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6 border border-white/20">
                                        <div className="flex items-start md:items-center gap-5">
                                            <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center text-white shrink-0 mt-1 md:mt-0 shadow-inner">
                                                <Icon name="award" size={30} className="text-yellow-300" />
                                            </div>
                                            <div className="space-y-1.5">
                                                <div className="flex items-center gap-2 flex-wrap">
                                                    <span className="bg-yellow-400 text-[#3A3A20] text-xs font-black px-3 py-0.5 rounded-full uppercase tracking-wider shadow-xs">
                                                        🎉 最新批改完成通知
                                                    </span>
                                                    <span className="text-xs text-white/80">
                                                        {new Date(latestGradedRecord.gradedAt || latestGradedRecord.timestamp).toLocaleDateString()}
                                                    </span>
                                                </div>
                                                <h4 className="text-2xl font-bold serif leading-snug">
                                                    《{articles.find(a => a.id === latestGradedRecord.articleId)?.title || '閱讀測驗'}》已由老師完成 PIRLS 閱讀素養診斷！
                                                </h4>
                                                <p className="text-sm text-white/90 flex flex-wrap items-center gap-x-3 gap-y-1">
                                                    <span>測驗總分：<strong className="text-yellow-300 text-base">{latestGradedRecord.score} 分</strong></span>
                                                    {latestGradedRecord.pirlsResult?.pirlsScore && (
                                                        <span>‧ PIRLS 常模分數：<strong className="text-white">{latestGradedRecord.pirlsResult.pirlsScore} 分</strong></span>
                                                    )}
                                                    <span>‧ 四向度雷達圖與能力基準落點已產出</span>
                                                </p>
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => handleViewDetail(latestGradedRecord)}
                                            className="px-6 py-3.5 bg-white text-[#4A4A30] hover:bg-yellow-50 font-bold text-sm rounded-2xl transition-all shadow-lg shrink-0 flex items-center gap-2 cursor-pointer self-stretch md:self-auto justify-center"
                                        >
                                            <span>查看完整 PIRLS 診斷報告</span>
                                            <Icon name="chevron-right" size={18} />
                                        </button>
                                    </div>
                                )}
                                <div className="bg-[#5A5A40] text-white p-12 rounded-[3rem] shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <div className="inline-flex items-center gap-2 bg-white/20 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-4">
                                            <Icon name="compass" size={14} />
                                            PIRLS 國際標準閱讀架構
                                        </div>
                                        <h1 className="text-4xl md:text-5xl font-bold serif mb-4">今天想讀什麼？</h1>
                                        <p className="text-white/80 text-lg max-w-xl leading-relaxed">
                                            文章涵蓋文學性與資訊性兩大文本，完成四層次挑戰後即可取得 AI 國際常模落點與四向度能力雷達圖！
                                        </p>
                                    </div>
                                    <div className="absolute right-[-40px] bottom-[-40px] text-white/10 opacity-20">
                                        <Icon name="book-open" size={300} />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {assignedArticles.map((a) => {
                                        const assignment = a.assignment;
                                        const isExpired = assignment ? Date.now() > assignment.deadline : false;
                                        const hasCompleted = records.some(r => String(r.articleId) === String(a.id));
                                        const isSingle = assignment?.attemptType === 'single';
                                        const isDisabled = !recordsLoaded || isExpired || (isSingle && hasCompleted);
                                        const textType = a.textType ? TEXT_TYPE_LABELS[a.textType] : TEXT_TYPE_LABELS.literary;
                                        const gradeLabel = a.gradeLevel ? (GRADE_LEVEL_LABELS[a.gradeLevel] || '高年級') : null;

                                        return (
                                            <div 
                                                key={a.id} 
                                                className={`bg-white p-8 rounded-[2.5rem] border border-black/5 shadow-sm transition-all duration-300 flex flex-col ${isDisabled ? "opacity-60 grayscale" : "hover:shadow-xl hover:-translate-y-2"}`}
                                            >
                                                {/* Badges */}
                                                <div className="flex flex-wrap items-center gap-2 mb-4">
                                                    {textType && (
                                                        <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${textType.color}`}>
                                                            {textType.label}
                                                        </span>
                                                    )}
                                                    {gradeLabel && (
                                                        <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-gray-100 text-gray-600">
                                                            {gradeLabel}
                                                        </span>
                                                    )}
                                                    <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full ${isSingle ? "bg-amber-100 text-amber-800" : "bg-blue-100 text-blue-800"}`}>
                                                        {isSingle ? '單次測驗' : '多次測驗'}
                                                    </span>
                                                    {isExpired ? (
                                                        <span className="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ml-auto">
                                                            已截止
                                                        </span>
                                                    ) : (hasCompleted && isSingle ? (
                                                        <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ml-auto">
                                                            已完成
                                                        </span>
                                                    ) : null)}
                                                </div>

                                                <h3 className="text-2xl font-bold serif line-clamp-2 leading-tight mb-3">{a.title}</h3>
                                                <p className="text-sm text-gray-500 line-clamp-4 mb-6 flex-1 leading-relaxed">{a.content}</p>
                                                
                                                {assignment && (
                                                    <div className="space-y-2 mb-6 p-3.5 bg-gray-50 rounded-2xl text-xs">
                                                        <div className="flex items-center gap-2">
                                                            <Icon name="clock" size={16} className={isExpired ? "text-red-500" : "text-gray-400"} />
                                                            <span className={isExpired ? "text-red-500 font-bold" : "text-gray-500"}>
                                                                截止：{new Date(assignment.deadline).toLocaleString()}
                                                            </span>
                                                        </div>
                                                        {isSingle && hasCompleted && (
                                                            <div className="text-[11px] text-amber-600 font-bold flex items-center gap-1 pt-1">
                                                                <Icon name="check-circle" size={12} /> 您已完成此單次測驗
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                <button 
                                                    disabled={isDisabled}
                                                    onClick={() => {
                                                        if (!recordsLoaded) {
                                                            alert('系統正在載入您的測驗紀錄，請稍候再試...');
                                                            return;
                                                        }
                                                        if (isExpired) {
                                                            alert('此測驗已過截止日期');
                                                            return;
                                                        }
                                                        if (isSingle && hasCompleted) {
                                                            alert('此測驗設定為「單次測驗」，您已經作答繳交過，無法再次作答！');
                                                            return;
                                                        }
                                                        setSelectedArticle(a);
                                                        setView('quiz');
                                                    }}
                                                    className={`w-full py-4 rounded-2xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer ${isDisabled ? "bg-gray-100 text-gray-400 cursor-not-allowed shadow-none" : "bg-[#5A5A40] text-white hover:bg-[#4A4A30] shadow-[#5A5A40]/20"}`}
                                                >
                                                    {!recordsLoaded ? '讀取測驗狀態中...' : (isExpired ? '測驗已結束' : (isSingle && hasCompleted ? '已完成（單次測驗已繳交）' : '開始閱讀與測驗'))}
                                                    {!isDisabled && <Icon name="chevron-right" size={20} />}
                                                </button>
                                            </div>
                                        );
                                    })}
                                    {assignedArticles.length === 0 && (
                                        <div className="col-span-full py-20 text-center bg-white rounded-[3rem] border-2 border-dashed border-gray-200">
                                            <p className="text-gray-400 text-lg">目前尚無指派的閱讀任務，先休息一下吧！</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* VIEW: Results History */}
                        {view === 'results' && (
                            <div className="space-y-10">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-4xl font-bold serif mb-2">我的測驗與 PIRLS 診斷</h2>
                                        <p className="text-gray-400">回顧您的四向度素養歷程、國際常模落點與 AI 老師回饋</p>
                                    </div>
                                    <button onClick={() => setView('list')} className="px-6 py-3 bg-white rounded-2xl text-sm font-bold text-[#5A5A40] border border-black/5 shadow-sm hover:shadow-md transition-all">返回文章列表</button>
                                </div>
                                
                                <div className="grid grid-cols-1 gap-6">
                                    {records.length > 0 ? records.map((r) => {
                                        const articleObj = articles.find(a => a.id === r.articleId);
                                        const pirlsBenchmark = r.pirlsResult?.benchmark ? PIRLS_BENCHMARK_CONFIG[r.pirlsResult.benchmark] : null;

                                        return (
                                            <div key={r.id} className="bg-white p-8 rounded-[2rem] border border-black/5 shadow-sm hover:shadow-md transition-all flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                                                <div className="flex items-center gap-6">
                                                    <div className={`w-16 h-16 rounded-3xl flex items-center justify-center shrink-0 shadow-inner ${r.graded ? "bg-green-50 text-green-600" : "bg-amber-50 text-amber-600"}`}>
                                                        {r.graded ? <Icon name="check-circle" size={32} /> : <Icon name="clock" size={32} />}
                                                    </div>
                                                    <div>
                                                        <div className="flex items-center gap-2 mb-1 flex-wrap">
                                                            <h4 className="font-bold text-xl">{articleObj?.title || '未知文章'}</h4>
                                                            {r.graded ? (
                                                                pirlsBenchmark && (
                                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${pirlsBenchmark.badgeColor}`}>
                                                                        {pirlsBenchmark.short}
                                                                    </span>
                                                                )
                                                            ) : (
                                                                <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 flex items-center gap-1">
                                                                    <Icon name="clock" size={10} /> 待老師後台批改
                                                                </span>
                                                            )}
                                                        </div>
                                                        <p className="text-sm text-gray-400 flex items-center gap-4 flex-wrap">
                                                            <span className="flex items-center gap-1.5">
                                                                <Icon name="calendar" size={14} />
                                                                {new Date(r.timestamp).toLocaleString()}
                                                            </span>
                                                            {r.duration !== undefined && (
                                                                <span className="flex items-center gap-1 bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full text-xs font-bold font-mono">
                                                                    <Icon name="clock" size={12} />
                                                                    <span>作答：{Math.floor(r.duration / 60)} 分 {r.duration % 60} 秒</span>
                                                                </span>

        // --- Component: Quiz Interface (Reading -> Quiz -> Submission/Results) ---
        const QuizInterface = ({ article, user, assignment, records, onBack }) => {
            const [step, setStep] = useState('reading'); // reading, quiz, results
            const [questions, setQuestions] = useState(null);
            const [answersTF, setAnswersTF] = useState({});
            const [answersMC, setAnswersMC] = useState({});
            const [answersEnMC, setAnswersEnMC] = useState({});
            const [answersSA, setAnswersSA] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [startTime, setStartTime] = useState(null);
            const [newRecordId, setNewRecordId] = useState(null);
            const [submittedRecord, setSubmittedRecord] = useState(null);
            const [submissionStats, setSubmissionStats] = useState({ correctCount: 0, totalObjective: 0, objScore: 0 });
            const [showArticleModal, setShowArticleModal] = useState(false);
            const [articleFontSize, setArticleFontSize] = useState('text-base');

            const isSingle = assignment?.attemptType === 'single' || article?.assignment?.attemptType === 'single';
            const hasCompleted = records && records.some(r => String(r.articleId) === String(article?.id));

            useEffect(() => {
                if (step === 'quiz') {
                    setStartTime(Date.now());
                }
            }, [step]);

            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [step]);

            // Disable text copy/paste during quiz
            useEffect(() => {
                const preventDefault = (e) => {
                    if (step === 'reading' || step === 'quiz') {
                        e.preventDefault();
                        return false;
                    }
                };

                const handleKeydown = (e) => {
                    if (step === 'reading' || step === 'quiz') {
                        if ((e.ctrlKey || e.metaKey) && ['c', 'v', 'x'].includes(e.key.toLowerCase())) {
                            e.preventDefault();
                            return false;
                        }
                    }
                };

                if (step === 'reading' || step === 'quiz') {
                    document.addEventListener('copy', preventDefault);
                    document.addEventListener('paste', preventDefault);
                    document.addEventListener('cut', preventDefault);
                    document.addEventListener('contextmenu', preventDefault);
                    document.addEventListener('keydown', handleKeydown);
                }

                return () => {
                    document.removeEventListener('copy', preventDefault);
                    document.removeEventListener('paste', preventDefault);
                    document.removeEventListener('cut', preventDefault);
                    document.removeEventListener('contextmenu', preventDefault);
                    document.removeEventListener('keydown', handleKeydown);
                };
            }, [step]);

            // Fetch questions for this article
            useEffect(() => {
                const fetchQuestions = async () => {
                    if (!article || !article.id) {
                        setQuestions({ tf: [], mc: [], en_mc: [], sa: [] });
                        return;
                    }
                    try {
                        const tf = await window.fb.get(window.fb.ref(window.fb.db, `questions_tf/${article.id}`));
                        const mc = await window.fb.get(window.fb.ref(window.fb.db, `questions_mc/${article.id}`));
                        const en_mc = await window.fb.get(window.fb.ref(window.fb.db, `questions_en_mc/${article.id}`));
                        const sa = await window.fb.get(window.fb.ref(window.fb.db, `questions_sa/${article.id}`));
                        
                        setQuestions({
                            tf: tf.val() || [],
                            mc: mc.val() || [],
                            en_mc: en_mc.val() || [],
                            sa: sa.val() || []
                        });
                    } catch (err) {
                        console.error("Fetch questions failed:", err);
                        setQuestions({ tf: [], mc: [], en_mc: [], sa: [] });
                    }
                };
                fetchQuestions();
            }, [article?.id]);

            // Real-time listener for the submitted record in results view
            useEffect(() => {
                if (newRecordId && window.fb) {
                    const recordRef = window.fb.ref(window.fb.db, `records/${newRecordId}`);
                    const unsubscribe = window.fb.onValue(recordRef, (snap) => {
                        const val = snap.val();
                        if (val) {
                            setSubmittedRecord({ id: newRecordId, ...val });
                        }
                    });
                    return () => unsubscribe();
                }
            }, [newRecordId]);

            const handleSubmit = async () => {
                setIsSubmitting(true);
                try {
                    const studentIdNorm = String(user.id || user.studentId || '').trim();

                    // Double safety check against concurrent duplicate submissions
                    if (isSingle) {
                        const recordsSnap = await window.fb.get(window.fb.ref(window.fb.db, 'records'));
                        if (recordsSnap.exists()) {
                            const allRecs = Object.values(recordsSnap.val());
                            const alreadyDone = allRecs.some(r => 
                                String(r.articleId) === String(article.id) && 
                                String(r.studentId || '').trim().toLowerCase() === studentIdNorm.toLowerCase()
                            );
                            if (alreadyDone) {
                                alert('此為單次測驗，系統紀錄顯示您已提交過，無法重複提交！');
                                setIsSubmitting(false);
                                onBack();
                                return;
                            }
                        }
                    }

                    const duration = startTime ? Math.round((Date.now() - startTime) / 1000) : 0;
                    
                    // Simple objective score calculation
                    let correctCount = 0;
                    let totalObjective = 0;
                    if (questions.tf) {
                        questions.tf.forEach((q, idx) => {
                            totalObjective++;
                            if (answersTF[idx] === q.answer) correctCount++;
                        });
                    }
                    if (questions.mc) {
                        questions.mc.forEach((q, idx) => {
                            totalObjective++;
                            if (answersMC[idx] === q.answer) correctCount++;
                        });
                    }
                    if (questions.en_mc) {

                                                    </div>
                                                    <p className="font-bold text-base text-gray-800 mb-3">{q.content}</p>
                                                    <div className="flex gap-6 text-sm font-bold font-mono">
                                                        <span className={isCorrect ? "text-green-600" : "text-red-600"}>
                                                            你的回答：{studentAns === undefined ? '未答' : (studentAns ? 'O' : 'X')}
                                                        </span>
                                                        <span className="text-green-600">正確答案：{q.answer ? 'O' : 'X'}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            )}

                            {/* Review MC */}
                            {questions.mc.length > 0 && (
                                <section className="bg-white p-10 md:p-12 rounded-[3rem] border border-black/5 shadow-xl space-y-6">
                                    <h3 className="text-2xl font-bold serif flex items-center gap-3 text-gray-800">
                                        <Icon name="list" className="text-blue-500" size={26} /> 選擇題對答
                                    </h3>
                                    <div className="space-y-6">
                                        {questions.mc.map((q, idx) => {
                                            const studentAnsIdx = answersMC[idx];
                                            const isCorrect = studentAnsIdx === q.answer;
                                            return (
                                                <div key={idx} className={`p-6 rounded-[2rem] border transition-all ${isCorrect ? "bg-green-50/50 border-green-100" : "bg-red-50/50 border-red-100"}`}>
                                                    <div className="flex flex-wrap items-center gap-2 mb-2">
                                                        <span className="font-mono text-xs font-bold text-gray-400">第 {idx + 1} 題</span>
                                                        <PirlsBadge process={q.pirlsProcess} />
                                                        <span className={`ml-auto px-3 py-1 rounded-full text-xs font-bold ${isCorrect ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>
                                                            {isCorrect ? '正確' : '錯誤'}
                                                        </span>
                                                    </div>
                                                    <p className="font-bold text-base text-gray-800 mb-4">{q.content}</p>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {q.options.map((opt, oIdx) => (
                                                            <div key={oIdx} className={`p-3.5 rounded-xl border text-sm flex items-center justify-between ${oIdx === q.answer ? "bg-green-100 border-green-200 text-green-800 font-bold" : (oIdx === studentAnsIdx && !isCorrect ? "bg-red-100 border-red-200 text-red-800" : "bg-white border-gray-100 text-gray-600")}`}>
                                                                <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                                                {oIdx === q.answer && <span className="text-[10px] bg-green-200 px-2 py-0.5 rounded-full font-bold">正確</span>}
                                                                {oIdx === studentAnsIdx && !isCorrect && <span className="text-[10px] bg-red-200 px-2 py-0.5 rounded-full font-bold">你的選擇</span>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            )}

                            {/* Review English MC */}
                            {questions.en_mc && questions.en_mc.length > 0 && (
                                <section className="bg-white p-10 md:p-12 rounded-[3rem] border border-black/5 shadow-xl space-y-6">
                                    <h3 className="text-2xl font-bold serif flex items-center gap-3 text-gray-800">
                                        <Icon name="languages" className="text-indigo-500" size={26} /> 英語選擇題對答
                                    </h3>
                                    <div className="space-y-6">
                                        {questions.en_mc.map((q, idx) => {
                                            const studentAnsIdx = answersEnMC[idx];
                                            const isCorrect = studentAnsIdx === q.answer;
                                            return (
                                                <div key={idx} className={`p-6 rounded-[2rem] border transition-all ${isCorrect ? "bg-green-50/50 border-green-100" : "bg-red-50/50 border-red-100"}`}>
                                                    <div className="flex flex-wrap items-center gap-2 mb-2">
                                                        <span className="font-mono text-xs font-bold text-gray-400">第 {idx + 1} 題</span>
                                                        <PirlsBadge process={q.pirlsProcess} />
                                                        <span className={`ml-auto px-3 py-1 rounded-full text-xs font-bold ${isCorrect ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>
                                                            {isCorrect ? '正確' : '錯誤'}
                                                        </span>
                                                    </div>
                                                    <p className="font-bold text-base text-gray-800 mb-4">{q.content}</p>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {q.options.map((opt, oIdx) => (
                                                            <div key={oIdx} className={`p-3.5 rounded-xl border text-sm flex items-center justify-between ${oIdx === q.answer ? "bg-green-100 border-green-200 text-green-800 font-bold" : (oIdx === studentAnsIdx && !isCorrect ? "bg-red-100 border-red-200 text-red-800" : "bg-white border-gray-100 text-gray-600")}`}>
                                                                <span>{String.fromCharCode(65 + oIdx)}. {opt}</span>
                                                                {oIdx === q.answer && <span className="text-[10px] bg-green-200 px-2 py-0.5 rounded-full font-bold">正確</span>}
                                                                {oIdx === studentAnsIdx && !isCorrect && <span className="text-[10px] bg-red-200 px-2 py-0.5 rounded-full font-bold">你的選擇</span>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            )}

                            <div className="flex gap-4">
                                <button 
                                    onClick={onBack}
                                    className="w-full py-6 bg-[#5A5A40] text-white rounded-[2.5rem] font-bold text-xl hover:bg-[#4A4A30] shadow-2xl shadow-[#5A5A40]/40 transition-all flex items-center justify-center gap-4"
                                >
                                    <Icon name="list" size={24} />
                                    完成測驗，返回文章列表
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
